name: Convert level images to WebP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'assets/backgrounds/*.png'
      - 'assets/previews/levels/*.png'
      - '.github/workflows/convert-images-to-webp.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Convert PNG files to WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          targets = [
              Path('assets/backgrounds'),
              Path('assets/previews/levels'),
          ]

          for folder in targets:
              if not folder.exists():
                  continue
              for source in sorted(folder.glob('*.png')):
                  dest = source.with_suffix('.webp')
                  with Image.open(source) as image:
                      image = image.convert('RGBA')
                      image.save(dest, 'WEBP', quality=86, method=6)
                  print(f'{source} -> {dest}')
          PY

      - name: Commit WebP files
        run: |
          git add assets/backgrounds/*.webp assets/previews/levels/*.webp
          if [ -z "$(git status --porcelain -- assets/backgrounds assets/previews/levels)" ]; then
            echo "No WebP changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate WebP level images"
          git push
