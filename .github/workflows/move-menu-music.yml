name: Move menu music asset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move MP3 to audio assets folder
        run: |
          mkdir -p assets/audio/music
          if [ -f backstage-whiskers.mp3 ]; then
            git mv backstage-whiskers.mp3 assets/audio/music/menu_theme.mp3
          else
            echo "backstage-whiskers.mp3 not found, nothing to move."
          fi

      - name: Commit moved music asset
        run: |
          git status --short
          if [ -z "$(git status --porcelain)" ]; then
            echo "No music asset changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Move menu music asset"
          git push
